<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karima &amp; Gwen</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <iframe
    id="invitation"
    src="./20_10_New__Invitation_Karima_Gwen_musique_Dadju.html"
    title="Invitation de mariage">
  </iframe>

  <script>
    const invitation = document.getElementById("invitation");

    invitation.addEventListener("load", function () {
      try {
        const doc = invitation.contentDocument;
        if (!doc) return;

        // Capture le clic avant les autres scripts de l'invitation.
        doc.addEventListener("click", function (event) {
          const chemin = typeof event.composedPath === "function"
            ? event.composedPath()
            : [];

          let candidats = chemin.filter(el => el && el.nodeType === 1);

          // Compatibilité si composedPath n'est pas disponible.
          if (candidats.length === 0) {
            let el = event.target;
            while (el && el.nodeType === 1) {
              candidats.push(el);
              el = el.parentElement;
            }
          }

          for (const element of candidats) {
            const texte = (
              element.innerText ||
              element.textContent ||
              element.value ||
              element.getAttribute?.("aria-label") ||
              element.getAttribute?.("title") ||
              ""
            ).replace(/\s+/g, " ").trim().toLowerCase();

            const estBouton =
              element.matches?.("button, a, input, [role='button'], [onclick]");

            if (
              (estBouton && /\b(sortir|quitter)\b/.test(texte)) ||
              (texte === "sortir" || texte === "quitter" || texte === "sortir ×")
            ) {
              event.preventDefault();
              event.stopPropagation();
              invitation.remove();
              document.body.style.background = "#f5f0e8";
              return;
            }
          }
        }, true);
      } catch (erreur) {
        console.error("Impossible de détecter le clic dans l'invitation :", erreur);
      }
    });
  </script>
</body>
</html>
