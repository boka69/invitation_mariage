  id="invitation-frame">
</iframe>

<script>
// Intercepte les actions ou écoute si le bouton "Sortir" est cliqué/signalé depuis l'iframe
window.addEventListener('message', function(event) {
    if (event.data === 'sortir' || event.data === 'close') {
        sortirPage();
    }
});

function sortirPage() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.close();
    }
    // Secours si le navigateur Android bloque la fermeture ou le retour
    setTimeout(function() {
        window.location.href = "about:blank";
    }, 300);
}
</script>
