```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Invitation Karima & Gwen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #soundButton {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      padding: 14px 22px;
      border: 0;
      border-radius: 30px;
      background: #fff;
      color: #111;
      font-size: 16px;
      cursor: pointer;
    }

    #soundButton.hidden {
      display: none;
    }
  </style>
</head>

<body>
  <video id="invitation"
         autoplay
         muted
         playsinline
         preload="auto">
    <source src="Invitation_karima_gwen.mp4"
            type="video/mp4">
    Votre navigateur ne prend pas en charge la vidéo.
  </video>

  <button id="soundButton">
    ▶ Voir l’invitation avec le son
  </button>

  <script>
    const video = document.getElementById("invitation");
    const button = document.getElementById("soundButton");

    video.play().catch(() => {
      button.classList.remove("hidden");
    });

    button.addEventListener("click", async () => {
      try {
        video.muted = false;
        await video.play();

        if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }

        button.classList.add("hidden");
      } catch (error) {
        video.muted = true;
        button.textContent = "▶ Appuyez pour lancer l’invitation";
      }
    });

    video.addEventListener("playing", () => {
      if (!video.muted) {
        button.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
```
