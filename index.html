<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Karima & Gwen</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
</style>
</head>
<body>
<video id="video" autoplay muted loop playsinline>
  <source src="Invitation_Karima_Gwen_finale.mp4" type="video/mp4">
</video>
<audio id="musique" loop>
  <source src="Dadju-Wouli-Liya.mp3" type="audio/mpeg">
</audio>
<script>
const video = document.getElementById('video');
const audio = document.getElementById('musique');

async function demarrer() {
  try {
    await video.play();
    audio.muted = false;
    await audio.play();
    document.removeEventListener('click', demarrer);
    document.removeEventListener('touchstart', demarrer);
  } catch (e) {}
}
document.addEventListener('click', demarrer);
document.addEventListener('touchstart', demarrer);
</script>
</body>
</html>
