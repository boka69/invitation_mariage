<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karima &amp; Gwen</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b211d;
    }

    iframe {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <iframe
    id="invitation"
    src="./20_10_New__Invitation_Karima_Gwen_musique_Dadju.html"
    title="Invitation de mariage">
  </iframe>

  <script>
    const invitation = document.getElementById("invitation");

    function quitterPage() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
      }
    }

    invitation.addEventListener("load", function () {
      try {
        const doc = invitation.contentDocument || invitation.contentWindow.document;
        if (!doc) return;

        doc.addEventListener("click", function (event) {
          const target = event.target;
          
          // On récupère le texte exact de l'élément cliqué (et de son enfant direct si c'est une icône/span)
          const texte = (target.innerText || target.textContent || "").trim().toLowerCase();
          const idOuClasse = ((target.id || "") + " " + (target.className || "")).toLowerCase();

          // On vérifie STRICTEMENT si c'est le bouton "sortir" ou "quitter" (on ignore complètement MARHABA ici)
          const estLeBoutonSortir = texte === "sortir" || texte === "quitter" || idOuClasse.includes("sortir") || idOuClasse.includes("quitter");

          if (estLeBoutonSortir) {
            event.preventDefault();
            event.stopPropagation();
            quitterPage();
          }
          // Si ce n'est pas "sortir", on laisse l'invitation faire sa vie normalement (notamment MARHABA)
        }, true);

      } catch (erreur) {
        console.error("Impossible d'accéder au contenu de l'iframe :", erreur);
      }
    });
  </script>
</body>
</html>
