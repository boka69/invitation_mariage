<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karima &amp; Gwen</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b211d;
    }

    iframe {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <iframe
    id="invitation"
    src="./20_10_New__Invitation_Karima_Gwen_musique_Dadju.html"
    title="Invitation de mariage">
  </iframe>

  <script>
    const invitation = document.getElementById("invitation");

    // Fonction pour gérer l'action de sortie
    function quitterPage() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
      }
    }

    invitation.addEventListener("load", function () {
      try {
        const doc = invitation.contentDocument || invitation.contentWindow.document;
        if (!doc) return;

        doc.addEventListener("click", function (event) {
          let target = event.target;

          while (target && target !== doc.body) {
            const texte = (
              target.innerText ||
              target.textContent ||
              target.getAttribute?.("aria-label") ||
              target.getAttribute?.("title") ||
              ""
            ).toLowerCase();

            const idOuClasse = (
              (target.id || "") + " " + (target.className || "")
            ).toLowerCase();

            // Si le clic concerne "marhaba", on laisse l'invitation faire son travail normalement (on ne fait rien)
            const estMarhaba = /marhaba|bienvenue/.test(texte) || /marhaba|bienvenue/.test(idOuClasse);
            if (estMarhaba) {
              return; 
            }

            // On cible uniquement le bouton de sortie
            const estSortie = /sortir|quitter|fermer/.test(texte) || /sortir|quitter|fermer/.test(idOuClasse);

            if (estSortie) {
              event.preventDefault();
              event.stopPropagation();
              quitterPage();
              return;
            }

            target = target.parentElement;
          }
        }, true);

      } catch (erreur) {
        console.error("Impossible d'accéder au contenu de l'iframe :", erreur);
      }
    });
  </script>
</body>
</html>
